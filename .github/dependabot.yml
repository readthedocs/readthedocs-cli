# Weekly dependency updates with a 14-day cooldown, so brand-new releases
# that may be broken or compromised are not pulled in.
# Security updates ignore the cooldown.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    allow:
      # Also bump transitive pins in uv.lock, not just pyproject.toml deps.
      - dependency-type: "all"
    groups:
      # One PR for everything.
      python-dependencies:
        patterns:
          - "*"
