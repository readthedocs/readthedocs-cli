[tox]
minversion = 4.0
envlist = pre-commit,py310,py311,py312,py313,py314

# ``uv-venv-lock-runner`` (from tox-uv) provisions each env with ``uv sync``,
# so tests run against the pinned set in uv.lock.
[testenv]
runner = uv-venv-lock-runner
with_dev = true
commands =
    pytest {posargs}

[testenv:pre-commit]
description = run pre-commit to ensure the changes are valid against our lintings
runner = uv-venv-runner
skip_install = true
deps =
    pre-commit
    docutils # Required for rst2html in vale
commands =
    pre-commit run --all-files --show-diff-on-failure
