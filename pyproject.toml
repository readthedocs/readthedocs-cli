[project]
name = "readthedocs-cli"
version = "0.1.0"
description = "Command line client for Read the Docs. Upload pre-built documentation artifacts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Read the Docs, Inc", email = "support@readthedocs.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/readthedocs/readthedocs-cli"
Documentation = "https://docs.readthedocs.com/"
Source = "https://github.com/readthedocs/readthedocs-cli"
Tracker = "https://github.com/readthedocs/readthedocs-cli/issues"

[project.scripts]
readthedocs = "readthedocs_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readthedocs_cli"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
